services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: user_directory
      MYSQL_USER: user_directory
      MYSQL_PASSWORD: user_directory
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - user-directory-mysql:/var/lib/mysql

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/user_directory?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USER: user_directory
      DB_PASSWORD: user_directory
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  user-directory-mysql:
